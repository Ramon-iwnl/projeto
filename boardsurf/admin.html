<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"><title>Administração | BoardSurf</title></head><body data-required-role="MASTER"><div class="accessibility-bar" aria-label="Acessibilidade"><button type="button" onclick="toggleDarkMode()">🌙 Modo Escuro</button><button type="button" onclick="aumentarFonte()" aria-label="Aumentar fonte">A+</button><button type="button" onclick="diminuirFonte()" aria-label="Diminuir fonte">A-</button></div><div class="background-container"></div><header>
  <nav class="nav-bar" aria-label="Menu principal">
    <a href="index.html" class="logo-container"><div class="BoardSurf"><img src="assets/img/logo.png.png" alt="Logo BoardSurf" class="logo"><h1>BoardSurf Multimarcas</h1></div></a>
    <div class="nav-list"><ul>
      <li class="nav-item"><a href="index.html" class="nav-link">Início</a></li>
      <li class="nav-item"><a href="produtos.html" class="nav-link">Produtos</a></li>
      <li class="nav-item"><a href="modelo-bd.html" class="nav-link">Modelo do BD</a></li>
      <li class="nav-item master-only"><a href="admin.html" class="nav-link">Usuários</a></li>
      <li class="nav-item master-only"><a href="logs.html" class="nav-link">Logs</a></li>
      <li class="nav-item master-only"><a href="painel-produtos.html" class="nav-link">Gerenciar produtos</a></li>
    </ul></div>
    <div class="buttons-area">
      <div id="usuario-logado-nome" class="logged-user" hidden style="display:none"><i class="fa-solid fa-user" aria-hidden="true"></i><span></span></div>
      <button type="button" class="carrinho-link" onclick="abrirCarrinho()" aria-label="Abrir carrinho"><i class="fa-solid fa-cart-shopping" aria-hidden="true"></i><span id="contador-carrinho">0</span></button>
      <a href="alterar-senha.html" class="nav-link common-only">Alterar senha</a>
      <div id="visitante-botoes" class="login-button"><button type="button" onclick="location.href='login.html'">Login</button><button type="button" onclick="location.href='cadastro.html'">Cadastrar</button></div>
      <button type="button" id="btn-perfil" style="display:none">Meu Perfil</button>
      <button type="button" id="btn-sair" onclick="deslogarUsuario()" style="display:none">Sair</button>
    </div>
  </nav>
</header><main class="admin-main"><section class="admin-card"><div class="admin-heading"><div><span class="eyebrow">Usuário Master</span><h2>Consulta de Usuários</h2></div><a class="btn-secondary" href="painel-produtos.html">Gerenciar Produtos</a> <a class="btn-secondary" href="logs.html">Tela de Log</a></div><div class="search-row"><input id="buscaUsuario" placeholder="Pesquisar parte do nome do usuário comum"><button class="btn-primary" onclick="carregarUsuarios()">Pesquisar</button></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Login</th><th>E-mail</th><th>CPF</th><th>Perfil</th><th>Ação</th></tr></thead><tbody id="tabelaUsuarios"></tbody></table></div></section></main><div id="mensagem"></div><script src="assets/js/jsprjeto.js" defer></script><div id="perfil-modal" class="perfil-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="perfil-titulo">
  <div class="card perfil-card"><div class="perfil-header"><h2 id="perfil-titulo">Meu Perfil</h2><button type="button" class="btn-fechar-perfil" onclick="fecharModalPerfil()" aria-label="Fechar perfil">×</button></div>
    <form id="form-perfil-edit" class="perfil-dados">
      <label for="perf-nome">Nome</label><input id="perf-nome" disabled required maxlength="80">
      <label for="perf-email">E-mail</label><input id="perf-email" type="email" disabled required maxlength="120">
      <label for="perf-celular">Celular</label><input id="perf-celular" type="tel" disabled required>
      <label for="perf-cidade">Cidade</label><input id="perf-cidade" disabled required maxlength="100">
      <label for="perf-estado">Estado</label><input id="perf-estado" disabled required maxlength="2">
      <div class="perfil-botoes-acoes"><button type="button" id="btn-editar-perfil" onclick="ativarEdicaoPerfil()">Editar Dados</button><button type="submit" id="btn-salvar-perfil" style="display:none">Salvar Alterações</button></div>
    </form>
  </div>
</div>
<dialog id="erro-modal" class="app-dialog" aria-labelledby="erro-titulo"><h2 id="erro-titulo">Não foi possível concluir</h2><p id="erro-texto" role="alert"></p><form method="dialog"><button class="btn-primary" value="fechar">Entendi</button></form><a href="erro.html">Abrir tela de ajuda</a></dialog>
<dialog id="confirmar-modal" class="app-dialog" aria-labelledby="confirmar-titulo"><h2 id="confirmar-titulo">Confirmar exclusão</h2><p id="confirmar-texto"></p><form method="dialog"><button class="btn-secondary" value="cancelar">Cancelar</button><button class="btn-primary" value="confirmar">Excluir</button></form></dialog>
</body></html>
